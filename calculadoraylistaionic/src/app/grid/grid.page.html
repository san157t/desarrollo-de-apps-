<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Grid</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-grid</h1>
  <p>El sistema de grilla organiza el contenido en filas y columnas responsivas.</p>

  <ion-grid>
    <ion-row>
      <ion-col size="4" style="background:#c8e6c9">Col 1</ion-col>
      <ion-col size="4" style="background:#a5d6a7">Col 2</ion-col>
      <ion-col size="4" style="background:#81c784">Col 3</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6" style="background:#90caf9">Col 6</ion-col>
      <ion-col size="6" style="background:#64b5f6">Col 6</ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
