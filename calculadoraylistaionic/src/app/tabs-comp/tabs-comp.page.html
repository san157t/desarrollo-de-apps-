<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Tabs (componente)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-tab-bar / ion-tab-button</h1>
  <p>Este es un ejemplo simple de una barra de pestañas independiente de la navegación principal de la app:</p>

  <div class="ion-padding" style="text-align:center; border:1px solid #ccc; border-radius:8px; margin-bottom:16px;">
    <p *ngIf="seleccionada === 'inicio'">Contenido de <b>Inicio</b></p>
    <p *ngIf="seleccionada === 'favoritos'">Contenido de <b>Favoritos</b></p>
    <p *ngIf="seleccionada === 'perfil'">Contenido de <b>Perfil</b></p>
  </div>

  <ion-tab-bar [selectedTab]="seleccionada">
    <ion-tab-button tab="inicio" (click)="seleccionada = 'inicio'">
      <ion-icon name="home"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="favoritos" (click)="seleccionada = 'favoritos'">
      <ion-icon name="heart"></ion-icon>
      <ion-label>Favoritos</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="perfil" (click)="seleccionada = 'perfil'">
      <ion-icon name="person"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-content>
