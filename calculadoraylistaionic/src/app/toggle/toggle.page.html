<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Toggle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-toggle</h1>
  <p>El toggle permite activar o desactivar una opción, como un interruptor.</p>

  <ion-item>
    <ion-toggle [(ngModel)]="wifi" slot="start"></ion-toggle>
    <ion-label>Wi-Fi</ion-label>
  </ion-item>

  <ion-item>
    <ion-toggle [(ngModel)]="bluetooth" slot="start" color="secondary"></ion-toggle>
    <ion-label>Bluetooth</ion-label>
  </ion-item>

  <p>Wi-Fi: {{ wifi ? 'Activado' : 'Desactivado' }} | Bluetooth: {{ bluetooth ? 'Activado' : 'Desactivado' }}</p>
</ion-content>
