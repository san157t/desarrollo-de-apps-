<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Media</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-img / ion-thumbnail / ion-avatar</h1>
  <p>Componentes para mostrar imágenes de forma optimizada.</p>

  <ion-item>
    <ion-avatar slot="start">
      <ion-img src="https://ionicframework.com/docs/img/demos/avatar.svg"></ion-img>
    </ion-avatar>
    <ion-label>Avatar de usuario</ion-label>
  </ion-item>

  <ion-item>
    <ion-thumbnail slot="start">
      <ion-img src="https://ionicframework.com/docs/img/demos/thumbnail.svg"></ion-img>
    </ion-thumbnail>
    <ion-label>Miniatura de imagen</ion-label>
  </ion-item>

  <ion-img src="https://ionicframework.com/docs/img/demos/card-media.png"></ion-img>
</ion-content>
