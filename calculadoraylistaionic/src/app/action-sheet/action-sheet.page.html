<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Action Sheet</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-action-sheet</h1>
  <p>Un action sheet es un menú de opciones que aparece desde abajo de la pantalla. Presiona el botón para verlo:</p>

  <ion-button expand="block" (click)="mostrarActionSheet()">Abrir Action Sheet</ion-button>
</ion-content>
