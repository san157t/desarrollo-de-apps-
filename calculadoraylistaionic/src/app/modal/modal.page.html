<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Modal</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-modal</h1>
  <p>Un modal es una ventana de contenido que aparece encima de la página actual.</p>

  <ion-button expand="block" (click)="abrir()">Abrir Modal</ion-button>

  <ion-modal [isOpen]="isOpen" (didDismiss)="cerrar()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Modal de ejemplo</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cerrar()">Cerrar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        Este es el contenido dentro del modal.
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
