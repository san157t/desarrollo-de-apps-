<ion-menu menuId="menu-demo" contentId="menu-demo-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menú lateral</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item button>
        <ion-label>Opción 1</ion-label>
      </ion-item>
      <ion-item button>
        <ion-label>Opción 2</ion-label>
      </ion-item>
      <ion-item button>
        <ion-label>Opción 3</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div id="menu-demo-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
      </ion-buttons>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <h1>ion-menu</h1>
    <p>Los menús son un patrón de navegación común. Pueden estar permanentemente en pantalla o revelarse cuando se necesiten. Presiona el botón para abrir el menú lateral:</p>

    <ion-button expand="block" (click)="abrirMenu()">Abrir Menú</ion-button>
  </ion-content>
</div>
