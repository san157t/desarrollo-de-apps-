<ion-content class="ion-padding">
  <h1>ion-badge</h1>

  <ion-badge>12</ion-badge>
  <ion-badge color="primary">Nuevo</ion-badge>
  <ion-badge color="secondary">42</ion-badge>
  <ion-badge color="success">Activo</ion-badge>
  <ion-badge color="warning">Pendiente</ion-badge>
  <ion-badge color="danger">3</ion-badge>
</ion-content>
