<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Infinite Scroll</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-infinite-scroll</h1>
  <p>Permite cargar más contenido automáticamente cuando el usuario llega al final de la lista.</p>

  <ion-list>
    <ion-item *ngFor="let item of items">
      <ion-label>Elemento {{ item }}</ion-label>
    </ion-item>
  </ion-list>

  <ion-infinite-scroll (ionInfinite)="cargarMas($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Cargando más elementos...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
