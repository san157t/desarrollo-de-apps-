<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Button</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-button</h1>
  <p>Los botones permiten al usuario realizar una acción con un solo toque.</p>

  <ion-button expand="block">Botón normal</ion-button>
  <ion-button expand="block" color="secondary">Secundario</ion-button>
  <ion-button expand="block" fill="outline">Outline</ion-button>
  <ion-button expand="block" fill="clear">Clear</ion-button>
  <ion-button expand="block" color="danger">
    <ion-icon name="trash-outline" slot="start"></ion-icon>
    Eliminar
  </ion-button>
</ion-content>
