<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Toast</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-toast</h1>
  <p>Un toast es un mensaje corto que aparece en la pantalla y desaparece automáticamente después de unos segundos.</p>

  <ion-button expand="block" (click)="mostrarToast()">Mostrar Toast</ion-button>
</ion-content>
