<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2"></ion-back-button>
    </ion-buttons>
    <ion-title>Checkbox</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>ion-checkbox</h1>
  <p>Las casillas de verificación permiten seleccionar una o varias opciones de un conjunto.</p>

  <ion-item>
    <ion-checkbox [(ngModel)]="aceptado" slot="start"></ion-checkbox>
    <ion-label>Acepto los términos y condiciones</ion-label>
  </ion-item>

  <ion-item>
    <ion-checkbox slot="start" checked="true"></ion-checkbox>
    <ion-label>Notificaciones activadas</ion-label>
  </ion-item>

  <p>Estado actual: {{ aceptado ? 'Aceptado' : 'No aceptado' }}</p>
</ion-content>
